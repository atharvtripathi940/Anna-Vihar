<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Anna-Vihar | Customer Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="login-page customer-login">


<div class="login-container">


    <!-- LEFT -->

    <div class="login-image customer-image">

        <div class="image-overlay">

            <div class="brand brand-white">
                🌱 Anna-Vihar
            </div>

            <span class="eyebrow white">
                CUSTOMER / BUYER PORTAL
            </span>

            <h1>
                Fresh from farm.<br>
                Fair for everyone.
            </h1>

            <p>
                Discover fresh produce directly
                from verified farmers and FPOs.
            </p>

        </div>

    </div>


    <!-- LOGIN -->

    <div class="login-box">

        <a
            href="index.html"
            class="back-link"
        >
            ← Back
        </a>


        <div class="login-logo">
            🛒
        </div>


        <span class="eyebrow">
            CUSTOMER / BUYER LOGIN
        </span>

        <h2>
            Welcome Back
        </h2>

        <p class="login-subtitle">
            Login to discover fresh produce and manage your orders.
        </p>


        <form
            id="customerLoginForm"
        >

            <label>
                Email / Mobile Number
            </label>

            <input
                type="text"
                id="customerEmail"
                placeholder="Enter email or mobile number"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="customerPassword"
                placeholder="Enter password"
                required
            >


            <div class="login-options">

                <label class="remember">
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">
                    Forgot Password?
                </a>

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Login as Customer
                →
            </button>

        </form>


        <p class="register-text">

            New Customer?

            <a href="#">
                Create Account
            </a>

        </p>


    </div>

</div>


<script src="script.js"></script>

</body>
</html>
